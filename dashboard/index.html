<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV Deforestation Detection Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #eee; overflow: hidden; }
        #container { display: flex; height: 100vh; }
        #sidebar {
            width: 320px; background: #161b22; padding: 20px;
            display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
            border-right: 1px solid #30363d;
        }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .header h1 { font-size: 16px; color: #58a6ff; letter-spacing: 1px; }
        .header .badge {
            background: #238636; color: #fff; padding: 2px 8px;
            border-radius: 12px; font-size: 10px; font-weight: 600;
        }
        .stat-card {
            background: #0d1117; border: 1px solid #30363d;
            border-radius: 8px; padding: 12px;
        }
        .stat-card .label {
            font-size: 11px; color: #8b949e; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value { font-size: 22px; font-weight: bold; margin-top: 4px; }
        .stat-row { display: flex; gap: 8px; }
        .stat-row .stat-card { flex: 1; }
        .health-good { color: #3fb950; }
        .health-warn { color: #d29922; }
        .health-bad { color: #f85149; }
        .progress-bar {
            width: 100%; height: 6px; background: #21262d;
            border-radius: 3px; margin-top: 6px; overflow: hidden;
        }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        #controls { display: flex; flex-wrap: wrap; gap: 6px; }
        button {
            flex: 1; min-width: 130px; padding: 8px; border: 1px solid #30363d;
            border-radius: 6px; cursor: pointer; font-size: 12px;
            font-weight: 600; transition: all 0.15s; background: #21262d; color: #c9d1d9;
        }
        button:hover { background: #30363d; border-color: #58a6ff; }
        #btn-reset { border-color: #58a6ff; color: #58a6ff; }
        #btn-step { border-color: #3fb950; color: #3fb950; }
        #btn-auto { border-color: #d29922; color: #d29922; }
        #btn-episode { border-color: #bc8cff; color: #bc8cff; }
        #canvas-container { flex: 1; position: relative; }
        canvas { display: block; }
        #legend {
            position: absolute; bottom: 15px; left: 15px;
            background: rgba(13,17,23,0.9); padding: 10px 14px;
            border-radius: 8px; border: 1px solid #30363d;
            display: flex; gap: 14px; font-size: 11px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; color: #8b949e; }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; }
        #status-bar {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(13,17,23,0.9); padding: 6px 16px;
            border-radius: 20px; border: 1px solid #30363d;
            font-size: 12px; color: #8b949e; display: none;
        }
        #log {
            max-height: 160px; overflow-y: auto; font-size: 10px;
            background: #0d1117; border: 1px solid #30363d;
            padding: 8px; border-radius: 6px; font-family: 'Consolas', monospace;
        }
        #log div { padding: 1px 0; color: #8b949e; }
        #log div.positive { color: #3fb950; }
        #log div.negative { color: #f85149; }
        #log div.info { color: #58a6ff; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    </style>
</head>
<body>
<div id="container">
    <div id="sidebar">
        <div class="header">
            <h1>UAV DEFORESTATION MONITOR</h1>
            <span class="badge">LIVE</span>
        </div>

        <div class="stat-card">
            <div class="label">Forest Health</div>
            <div class="value" id="health">--</div>
            <div class="progress-bar"><div class="progress-fill" id="health-bar" style="width:100%;background:#3fb950"></div></div>
        </div>

        <div class="stat-card">
            <div class="label">Fuel Remaining</div>
            <div class="value" id="fuel">--</div>
            <div class="progress-bar"><div class="progress-fill" id="fuel-bar" style="width:100%;background:#58a6ff"></div></div>
        </div>

        <div class="stat-row">
            <div class="stat-card">
                <div class="label">Step</div>
                <div class="value" id="step" style="font-size:18px">--</div>
            </div>
            <div class="stat-card">
                <div class="label">Reward</div>
                <div class="value" id="reward" style="font-size:18px">0.0</div>
            </div>
        </div>

        <div class="stat-row">
            <div class="stat-card">
                <div class="label">Threats</div>
                <div class="value" id="threats" style="font-size:18px;color:#d29922">--</div>
            </div>
            <div class="stat-card">
                <div class="label">Rangers</div>
                <div class="value" id="rangers" style="font-size:18px;color:#bc8cff">--</div>
            </div>
        </div>

        <div class="stat-row">
            <div class="stat-card">
                <div class="label">Wind</div>
                <div class="value" id="wind" style="font-size:16px;color:#58a6ff">--</div>
            </div>
            <div class="stat-card">
                <div class="label">Weather</div>
                <div class="value" id="weather" style="font-size:16px;color:#79c0ff">Clear</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="label">Last Action</div>
            <div class="value" id="action" style="font-size:16px;color:#f0883e">--</div>
        </div>

        <div id="controls">
            <button id="btn-reset" onclick="resetEnv()">Reset</button>
            <button id="btn-step" onclick="stepEnv()">Step</button>
            <button id="btn-auto" onclick="toggleAuto()">Auto Play</button>
            <button id="btn-episode" onclick="runEpisode()">Full Episode</button>
        </div>

        <div id="log"></div>
    </div>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="status-bar"></div>
        <div id="legend">
            <div class="legend-item"><div class="legend-color" style="background:#2d8a2e"></div>Healthy</div>
            <div class="legend-item"><div class="legend-color" style="background:#c8b41e"></div>At-Risk</div>
            <div class="legend-item"><div class="legend-color" style="background:#dc6414"></div>Deforesting</div>
            <div class="legend-item"><div class="legend-color" style="background:#5a3010"></div>Destroyed</div>
            <div class="legend-item"><div class="legend-color" style="background:#1e90ff"></div>Retardant</div>
            <div class="legend-item"><div class="legend-color" style="background:#00d4ff"></div>Drone</div>
            <div class="legend-item"><div class="legend-color" style="background:#ff2050"></div>Truck</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const API = "http://localhost:8000";
const GRID = 15;
const TILE = 3;  // Bigger tiles for better visibility
const COLORS = { 0: 0x2d8a2e, 1: 0xc8b41e, 2: 0xdc6414, 3: 0x5a3010 };
const RETARDANT_COLOR = 0x1e90ff;
const ACTION_NAMES = ["Up","Down","Left","Right","Scan","Retardant","Rangers","Base"];
const WIND_MAP = {"0,-1":"North","0,1":"South","-1,0":"West","1,0":"East"};

let scene, camera, renderer3d, orbitAngle = 0, orbitEnabled = true;
let tiles = [], treeMeshes = [], fireMeshes = [], stumpMeshes = [];
let droneMesh, droneRotors = [], droneShadow, droneTrail = [];
let truckBody, truckCabin, truckWheels = [];
let autoInterval = null, state = null, totalReward = 0;

function init3D() {
    const container = document.getElementById("canvas-container");
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    // No fog — see entire forest clearly

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 200);

    renderer3d = new THREE.WebGLRenderer({ canvas: document.getElementById("canvas"), antialias: true });
    renderer3d.setSize(container.clientWidth, container.clientHeight);
    renderer3d.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer3d.shadowMap.enabled = true;
    renderer3d.shadowMap.type = THREE.PCFSoftShadowMap;

    // Lighting
    const ambient = new THREE.AmbientLight(0x404860, 0.8);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffeedd, 1.0);
    sun.position.set(25, 40, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
    sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x6688cc, 0.3);
    fill.position.set(-20, 15, -10);
    scene.add(fill);

    // Ground plane
    const groundGeo = new THREE.PlaneGeometry(80, 80);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x2d8a2e });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(GRID * TILE / 2, -0.1, GRID * TILE / 2);
    ground.receiveShadow = true;
    scene.add(ground);

    // Build grid tiles
    for (let r = 0; r < GRID; r++) {
        tiles[r] = [];
        treeMeshes[r] = [];
        fireMeshes[r] = [];
        for (let c = 0; c < GRID; c++) {
            const x = c * TILE + TILE / 2;
            const z = r * TILE + TILE / 2;

            // Tile base — fully seamless, no gaps
            const tileGeo = new THREE.BoxGeometry(TILE * 1.05, 0.25, TILE * 1.05);
            const tileMat = new THREE.MeshLambertMaterial({ color: COLORS[0] });
            const tileMesh = new THREE.Mesh(tileGeo, tileMat);
            tileMesh.position.set(x, 0.125, z);
            tileMesh.receiveShadow = true;
            scene.add(tileMesh);
            tiles[r][c] = tileMesh;

            // Dense forest — trees fill the tile naturally
            const treeGroup = new THREE.Group();
            const canopyMat = new THREE.MeshLambertMaterial({ color: 0x2a7a28 });
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c3a1e });

            // Positions spread across the tile so canopies overlap
            const positions = [
                [0, 0, 1.0],
                [-0.5, -0.5, 0.75],
                [0.5, 0.4, 0.8],
                [-0.4, 0.5, 0.65],
                [0.45, -0.45, 0.7],
            ];

            positions.forEach(([tx, tz, sc], t) => {
                // Randomize slightly per tile
                const ox = tx + ((r * 7 + c * 3 + t * 11) % 20 - 10) / 80;
                const oz = tz + ((r * 3 + c * 11 + t * 7) % 20 - 10) / 80;
                const s = sc * (0.9 + ((r + c + t) % 5) / 25);

                // Trunk
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05 * s, 0.08 * s, 1.0 * s, 5),
                    trunkMat
                );
                trunk.position.set(ox, 0.5 * s, oz);
                trunk.castShadow = true;
                treeGroup.add(trunk);

                // Round canopy — overlapping spheres
                const c1 = new THREE.Mesh(
                    new THREE.SphereGeometry(0.5 * s, 7, 5), canopyMat.clone()
                );
                c1.position.set(ox, 1.15 * s, oz);
                c1.castShadow = true;
                treeGroup.add(c1);

                const c2 = new THREE.Mesh(
                    new THREE.SphereGeometry(0.35 * s, 6, 4), canopyMat.clone()
                );
                c2.position.set(ox + 0.1 * s, 1.45 * s, oz - 0.05 * s);
                treeGroup.add(c2);
            });

            treeGroup.position.set(x, 0.25, z);
            scene.add(treeGroup);
            treeMeshes[r][c] = treeGroup;

            // Deforesting indicator — half-cut trees, sawdust, danger markers
            const deforestGroup = new THREE.Group();

            // Half-cut trunk (tree being chopped)
            const cutTrunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.14, 0.6, 6),
                new THREE.MeshLambertMaterial({ color: 0x7a5030 })
            );
            cutTrunk.position.set(0.3, 0.3, 0);
            deforestGroup.add(cutTrunk);

            // Fallen tree (just cut, lying on ground)
            const fallenTree = new THREE.Mesh(
                new THREE.CylinderGeometry(0.07, 0.05, 1.2, 6),
                new THREE.MeshLambertMaterial({ color: 0x6b4226 })
            );
            fallenTree.rotation.z = Math.PI / 2;
            fallenTree.position.set(-0.1, 0.07, 0.3);
            fallenTree.rotation.y = (r * 5 + c) % 3;
            deforestGroup.add(fallenTree);

            // Sawdust pile
            const sawdust = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 6, 4),
                new THREE.MeshLambertMaterial({ color: 0xc8a860 })
            );
            sawdust.scale.y = 0.3;
            sawdust.position.set(0.3, 0.05, 0.05);
            deforestGroup.add(sawdust);

            // Red warning marker / flag
            const poleMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.02, 0.02, 1.0, 4), poleMat
            );
            pole.position.set(-0.4, 0.5, -0.3);
            deforestGroup.add(pole);
            const flag = new THREE.Mesh(
                new THREE.PlaneGeometry(0.25, 0.15),
                new THREE.MeshBasicMaterial({ color: 0xff3333, side: THREE.DoubleSide })
            );
            flag.position.set(-0.28, 0.9, -0.3);
            deforestGroup.add(flag);

            // Dust cloud (activity happening)
            const dust = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 6, 4),
                new THREE.MeshBasicMaterial({ color: 0x998866, transparent: true, opacity: 0.25 })
            );
            dust.position.y = 0.8;
            deforestGroup.add(dust);

            deforestGroup.position.set(x, 0.25, z);
            deforestGroup.visible = false;
            scene.add(deforestGroup);
            fireMeshes[r][c] = deforestGroup;

            // Destroyed tile: stumps + fallen logs (logging aftermath)
            const stumpGroup = new THREE.Group();
            const stumpMat = new THREE.MeshLambertMaterial({ color: 0x5a3a1a });
            const dirtMat = new THREE.MeshLambertMaterial({ color: 0x4a3010 });

            // 2-3 tree stumps (cut trees)
            for (let s = 0; s < 3; s++) {
                const sx = ((s * 41 + r * 11) % 100 - 50) / 50 * 0.7;
                const sz = ((s * 67 + c * 17) % 100 - 50) / 50 * 0.7;
                const stumpH = 0.15 + (s * 13 % 10) / 50;
                const stump = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.15, stumpH, 8),
                    stumpMat
                );
                stump.position.set(sx, stumpH / 2, sz);
                stumpGroup.add(stump);

                // Ring detail on stump top
                const ring = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.1, 0.1, 0.02, 8),
                    new THREE.MeshLambertMaterial({ color: 0x7a5a3a })
                );
                ring.position.set(sx, stumpH, sz);
                stumpGroup.add(ring);
            }

            // 2 fallen logs on ground
            const logMat = new THREE.MeshLambertMaterial({ color: 0x6b4226 });
            const log1 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.06, 1.0, 6), logMat
            );
            log1.rotation.z = Math.PI / 2;
            log1.rotation.y = (r * 5 + c * 3) % 3;
            log1.position.set(0.2, 0.08, -0.3);
            stumpGroup.add(log1);

            const log2 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.05, 0.7, 6), logMat
            );
            log2.rotation.z = Math.PI / 2;
            log2.rotation.y = (r * 7 + c * 2) % 4;
            log2.position.set(-0.3, 0.06, 0.2);
            stumpGroup.add(log2);

            // Sawdust/debris
            for (let d = 0; d < 4; d++) {
                const debris = new THREE.Mesh(
                    new THREE.BoxGeometry(0.08, 0.03, 0.06),
                    dirtMat
                );
                debris.position.set(
                    (Math.random() - 0.5) * 1.0,
                    0.015,
                    (Math.random() - 0.5) * 1.0
                );
                debris.rotation.y = Math.random() * Math.PI;
                stumpGroup.add(debris);
            }

            stumpGroup.position.set(x, 0.25, z);
            stumpGroup.visible = false;
            scene.add(stumpGroup);
            if (!stumpMeshes[r]) stumpMeshes[r] = [];
            stumpMeshes[r][c] = stumpGroup;
        }
    }

    // Drone - bigger and more visible
    const droneGroup = new THREE.Group();
    // Body
    const bodyGeo = new THREE.SphereGeometry(0.5, 16, 12);
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0x00d4ff, emissive: 0x005577, shininess: 100 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.scale.y = 0.5;
    droneGroup.add(body);

    // Glow ring around drone
    const glowGeo = new THREE.RingGeometry(0.6, 0.8, 32);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.rotation.x = -Math.PI / 2;
    glow.position.y = -0.1;
    droneGroup.add(glow);

    // Camera lens
    const lensGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.12, 8);
    const lensMat = new THREE.MeshPhongMaterial({ color: 0x222222, emissive: 0x111111 });
    const lens = new THREE.Mesh(lensGeo, lensMat);
    lens.position.y = -0.2;
    droneGroup.add(lens);

    // Arms + rotors — wider spread, clearly a quadcopter
    const armPositions = [
        [0.8, 0, 0.8], [-0.8, 0, 0.8],
        [0.8, 0, -0.8], [-0.8, 0, -0.8]
    ];
    armPositions.forEach(pos => {
        const armMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const arm = new THREE.Mesh(
            new THREE.BoxGeometry(Math.abs(pos[0]) * 2, 0.04, 0.08),
            armMat
        );
        arm.position.set(pos[0] / 2, 0, pos[2] / 2);
        droneGroup.add(arm);

        // Rotor disc — bigger, clearly spinning
        const rotorGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.02, 20);
        const rotorMat = new THREE.MeshBasicMaterial({ color: 0xaaddff, transparent: true, opacity: 0.5 });
        const rotor = new THREE.Mesh(rotorGeo, rotorMat);
        rotor.position.set(pos[0], 0.15, pos[2]);
        droneGroup.add(rotor);
        droneRotors.push(rotor);

        // Motor hub on each arm
        const hubGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1, 8);
        const hub = new THREE.Mesh(hubGeo, new THREE.MeshLambertMaterial({ color: 0x222222 }));
        hub.position.set(pos[0], 0.08, pos[2]);
        droneGroup.add(hub);
    });

    // LED lights — bigger
    const ledGeo = new THREE.SphereGeometry(0.06, 8, 6);
    const ledFront = new THREE.Mesh(ledGeo, new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
    ledFront.position.set(0, 0, 0.5);
    droneGroup.add(ledFront);
    const ledBack = new THREE.Mesh(ledGeo, new THREE.MeshBasicMaterial({ color: 0xff0000 }));
    ledBack.position.set(0, 0, -0.5);
    droneGroup.add(ledBack);

    // Landing gear
    const gearMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
    [[-0.3, -0.3], [0.3, -0.3]].forEach(([gx, gz]) => {
        const gear = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.04), gearMat);
        gear.position.set(gx, -0.35, gz);
        droneGroup.add(gear);
    });

    droneGroup.position.set(TILE / 2, 5, TILE / 2);
    droneGroup.castShadow = true;
    scene.add(droneGroup);
    droneMesh = droneGroup;

    // Drone shadow on ground
    const shadowGeo = new THREE.CircleGeometry(0.7, 16);
    const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 });
    droneShadow = new THREE.Mesh(shadowGeo, shadowMat);
    droneShadow.rotation.x = -Math.PI / 2;
    droneShadow.position.set(TILE / 2, 0.26, TILE / 2);
    scene.add(droneShadow);

    // Scan radius indicator (5x5 = 5 tiles around drone)
    const scanGeo = new THREE.RingGeometry(TILE * 2.3, TILE * 2.5, 32);
    const scanMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
    window.scanRing = new THREE.Mesh(scanGeo, scanMat);
    window.scanRing.rotation.x = -Math.PI / 2;
    window.scanRing.position.set(TILE / 2, 0.27, TILE / 2);
    scene.add(window.scanRing);

    // Wind direction arrow
    const arrowGeo = new THREE.ConeGeometry(0.5, 2, 8);
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0x58a6ff, transparent: true, opacity: 0.7 });
    window.windArrow = new THREE.Mesh(arrowGeo, arrowMat);
    window.windArrow.position.set(GRID * TILE / 2, 5, -3);
    scene.add(window.windArrow);

    // Truck
    const truckGroup = new THREE.Group();
    // Cargo body
    const cargoGeo = new THREE.BoxGeometry(0.9, 0.5, 1.4);
    const cargoMat = new THREE.MeshLambertMaterial({ color: 0xcc2030 });
    truckBody = new THREE.Mesh(cargoGeo, cargoMat);
    truckBody.position.y = 0.45;
    truckBody.castShadow = true;
    truckGroup.add(truckBody);

    // Cabin
    const cabinGeo = new THREE.BoxGeometry(0.85, 0.45, 0.6);
    const cabinMat = new THREE.MeshLambertMaterial({ color: 0x991520 });
    truckCabin = new THREE.Mesh(cabinGeo, cabinMat);
    truckCabin.position.set(0, 0.65, -0.7);
    truckGroup.add(truckCabin);

    // Windshield
    const windGeo = new THREE.PlaneGeometry(0.6, 0.3);
    const windMat = new THREE.MeshPhongMaterial({ color: 0x88bbff, transparent: true, opacity: 0.6, shininess: 100 });
    const windshield = new THREE.Mesh(windGeo, windMat);
    windshield.position.set(0, 0.72, -0.99);
    windshield.rotation.x = -0.1;
    truckGroup.add(windshield);

    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.12, 12);
    const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    [[-0.5, 0.15, -0.5], [0.5, 0.15, -0.5], [-0.5, 0.15, 0.5], [0.5, 0.15, 0.5]].forEach(p => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(p[0], p[1], p[2]);
        truckGroup.add(wheel);
        truckWheels.push(wheel);
    });

    // Logs on truck
    const logGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.85, 6);
    const logMat = new THREE.MeshLambertMaterial({ color: 0x6b4226 });
    for (let l = 0; l < 3; l++) {
        const logMesh = new THREE.Mesh(logGeo, logMat);
        logMesh.rotation.z = Math.PI / 2;
        logMesh.position.set(0, 0.75 + l * 0.18, 0.2 + l * 0.1);
        truckGroup.add(logMesh);
    }

    truckGroup.position.set(0, 0, 0);
    scene.add(truckGroup);
    truckMesh = truckGroup;

    // Resize
    window.addEventListener("resize", () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer3d.setSize(container.clientWidth, container.clientHeight);
    });

    // Mouse orbit
    let isDragging = false, prevX = 0, prevY = 0, camDist = 35, camAngle = 0.6, camHeight = 20;
    const canvasEl = document.getElementById("canvas");
    canvasEl.addEventListener("mousedown", e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; orbitEnabled = false; });
    window.addEventListener("mouseup", () => { isDragging = false; });
    window.addEventListener("mousemove", e => {
        if (!isDragging) return;
        camAngle += (e.clientX - prevX) * 0.005;
        camHeight = Math.max(10, Math.min(50, camHeight - (e.clientY - prevY) * 0.15));
        prevX = e.clientX; prevY = e.clientY;
        updateCamera(camAngle, camHeight, camDist);
    });
    canvasEl.addEventListener("wheel", e => {
        camDist = Math.max(10, Math.min(80, camDist + e.deltaY * 0.05));
        updateCamera(camAngle, camHeight, camDist);
        e.preventDefault();
    });

    function updateCamera(angle, h, dist) {
        const cx = GRID * TILE / 2, cz = GRID * TILE / 2;
        camera.position.set(
            cx + Math.sin(angle) * dist,
            h,
            cz + Math.cos(angle) * dist
        );
        camera.lookAt(cx, 0, cz);
    }

    // Initial camera — closer, lower angle for immersive view
    updateCamera(0.8, 20, 35);

    animate();
}

let frameCount = 0;
function animate() {
    requestAnimationFrame(animate);
    frameCount++;

    // Spin rotors
    droneRotors.forEach((r, i) => {
        r.rotation.y += 0.4 + i * 0.05;
    });

    // Drone hover bob — high above trees
    if (droneMesh) {
        droneMesh.position.y = 5 + Math.sin(frameCount * 0.04) * 0.2;
        droneMesh.rotation.z = Math.sin(frameCount * 0.02) * 0.04;
        droneMesh.rotation.x = Math.sin(frameCount * 0.015) * 0.02;
    }

    // Animate deforesting indicators (dust, flag flutter)
    for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
            if (fireMeshes[r][c].visible) {
                const children = fireMeshes[r][c].children;
                children.forEach((ch) => {
                    if (ch.material && ch.material.opacity && ch.material.opacity < 0.5) {
                        ch.position.y = 0.6 + Math.sin(frameCount * 0.05 + r + c) * 0.2;
                        ch.scale.setScalar(0.9 + Math.sin(frameCount * 0.08 + r * 2) * 0.15);
                    }
                });
            }
        }
    }

    // Rain particles
    if (!window.rainDrops) {
        window.rainDrops = [];
        const rainMat = new THREE.MeshBasicMaterial({ color: 0x88bbff, transparent: true, opacity: 0.4 });
        for (let i = 0; i < 80; i++) {
            const drop = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5, 4), rainMat);
            drop.position.set(Math.random() * GRID * TILE, 8 + Math.random() * 5, Math.random() * GRID * TILE);
            drop.visible = false;
            scene.add(drop);
            window.rainDrops.push(drop);
        }
    }
    const isRaining = state && state.rain_active;
    window.rainDrops.forEach(drop => {
        drop.visible = isRaining;
        if (isRaining) {
            drop.position.y -= 0.3;
            if (drop.position.y < 0) {
                drop.position.y = 10 + Math.random() * 3;
                drop.position.x = Math.random() * GRID * TILE;
                drop.position.z = Math.random() * GRID * TILE;
            }
        }
    });

    // Slow auto-orbit — close and immersive
    if (orbitEnabled) {
        orbitAngle += 0.001;
        const cx = GRID * TILE / 2, cz = GRID * TILE / 2;
        camera.position.x = cx + Math.sin(orbitAngle + 0.8) * 35;
        camera.position.y = 20;
        camera.position.z = cz + Math.cos(orbitAngle + 0.8) * 35;
        camera.lookAt(cx, 1, cz);
    }

    renderer3d.render(scene, camera);
}

function updateScene(data) {
    state = data;
    if (!data.grid) return;

    const retardantKeys = data.retardant_tiles ? Object.keys(data.retardant_tiles) : [];
    const retardantSet = new Set(retardantKeys);

    // Build river set for quick lookup
    const riverSet = new Set();
    if (data.river) {
        data.river.forEach(([r, c]) => riverSet.add(`${r},${c}`));
    }

    for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
            const val = data.grid[r][c];
            const key = `${r},${c}`;
            const isRetardant = retardantSet.has(key);
            const isRiver = riverSet.has(key);

            // Elevation — raise tiles based on height map
            let elev = 0;
            if (data.elevation) {
                elev = data.elevation[r][c] * 2.0;
            }
            tiles[r][c].position.y = 0.125 + elev;

            // River tiles = blue water
            if (isRiver && val === 0) {
                tiles[r][c].material.color.setHex(0x2266aa);
                tiles[r][c].scale.y = 0.15;
                tiles[r][c].position.y = elev - 0.1;
                // Hide trees on river
                if (treeMeshes[r][c]) treeMeshes[r][c].visible = false;
                if (stumpMeshes[r] && stumpMeshes[r][c]) stumpMeshes[r][c].visible = false;
                fireMeshes[r][c].visible = false;
                continue;
            }

            // Tile color
            tiles[r][c].material.color.setHex(isRetardant ? RETARDANT_COLOR : COLORS[val]);
            const heights = { 0: 1, 1: 0.8, 2: 0.5, 3: 0.2 };
            tiles[r][c].scale.y = heights[val];

            // Move trees up with elevation
            if (treeMeshes[r][c]) {
                treeMeshes[r][c].position.y = 0.25 + elev;
            }
            if (stumpMeshes[r] && stumpMeshes[r][c]) {
                stumpMeshes[r][c].position.y = 0.25 + elev;
            }
            fireMeshes[r][c].position.y = 0.25 + elev;

            // Tree + stump visibility based on tile state
            const tree = treeMeshes[r][c];
            const stump = stumpMeshes[r] ? stumpMeshes[r][c] : null;

            if (val === 0) {
                // HEALTHY: full green trees, no stumps
                tree.visible = true;
                tree.scale.set(1, 1, 1);
                tree.rotation.z = 0;
                tree.children.forEach(ch => {
                    if (ch.geometry.type === "SphereGeometry") {
                        ch.material.color.setHex(isRetardant ? 0x2888cc : 0x2a7a28);
                    }
                });
                if (stump) stump.visible = false;
            } else if (val === 1) {
                // AT-RISK: yellow/stressed trees, still standing
                tree.visible = true;
                tree.scale.set(1, 0.9, 1);
                tree.rotation.z = 0;
                tree.children.forEach(ch => {
                    if (ch.geometry.type === "SphereGeometry") {
                        ch.material.color.setHex(0xaaaa20);
                    }
                });
                if (stump) stump.visible = false;
            } else if (val === 2) {
                // DEFORESTING: trees tilting/falling, brown, with fire
                tree.visible = true;
                tree.scale.set(0.8, 0.5, 0.8);
                tree.rotation.z = 0.3;  // Trees leaning — being cut!
                tree.children.forEach(ch => {
                    if (ch.geometry.type === "SphereGeometry") {
                        ch.material.color.setHex(0x884400);
                    }
                });
                if (stump) stump.visible = false;
            } else {
                // DESTROYED: no trees, show stumps + fallen logs
                tree.visible = false;
                if (stump) stump.visible = true;
            }

            // Active logging indicators on deforesting tiles
            fireMeshes[r][c].visible = (val === 2 && !isRetardant);
        }
    }

    // Drone position + scan ring
    if (data.drone_pos) {
        const dr = data.drone_pos[0], dc = data.drone_pos[1];
        const dx = dc * TILE + TILE / 2;
        const dz = dr * TILE + TILE / 2;
        let droneElev = 0;
        if (data.elevation) droneElev = data.elevation[dr][dc] * 2.0;
        droneMesh.position.x = dx;
        droneMesh.position.z = dz;
        droneShadow.position.x = dx;
        droneShadow.position.z = dz;
        droneShadow.position.y = 0.26 + droneElev;
        if (window.scanRing) {
            window.scanRing.position.x = dx;
            window.scanRing.position.z = dz;
            window.scanRing.position.y = 0.27 + droneElev;
        }
    }
    // Wind arrow direction
    if (data.wind_dir && window.windArrow) {
        const wd = data.wind_dir;
        window.windArrow.rotation.z = wd[0] === 1 ? Math.PI : wd[0] === -1 ? 0 : wd[1] === 1 ? -Math.PI/2 : Math.PI/2;
    }

    // Truck — visible even when stopped (greyed out)
    if (data.truck_pos) {
        truckMesh.visible = true;
        truckMesh.position.x = data.truck_pos[1] * TILE + TILE / 2;
        truckMesh.position.z = data.truck_pos[0] * TILE + TILE / 2;
        truckMesh.position.y = 0;
        // Red when active, grey when stopped
        if (data.truck_active) {
            truckBody.material.color.setHex(0xcc2030);
        } else {
            truckBody.material.color.setHex(0x666666);
        }
    } else {
        truckMesh.visible = false;
    }

    // Update UI
    const h = data.forest_health;
    const healthEl = document.getElementById("health");
    healthEl.textContent = (h * 100).toFixed(1) + "%";
    healthEl.className = "value " + (h >= 0.7 ? "health-good" : h >= 0.5 ? "health-warn" : "health-bad");
    document.getElementById("health-bar").style.width = (h * 100) + "%";
    document.getElementById("health-bar").style.background = h >= 0.7 ? "#3fb950" : h >= 0.5 ? "#d29922" : "#f85149";

    const fuelPct = data.fuel / 300;
    document.getElementById("fuel").textContent = data.fuel + " / 300";
    document.getElementById("fuel-bar").style.width = (fuelPct * 100) + "%";
    document.getElementById("fuel-bar").style.background = fuelPct > 0.4 ? "#58a6ff" : fuelPct > 0.15 ? "#d29922" : "#f85149";

    document.getElementById("step").textContent = data.step + " / 300";
    document.getElementById("threats").textContent = data.detected_threats;
    document.getElementById("rangers").textContent = data.ranger_calls_left;
    document.getElementById("wind").textContent = WIND_MAP[data.wind_dir?.join(",")] || "--";
    document.getElementById("weather").textContent = data.rain_active ? "Rain" : "Clear";
    document.getElementById("weather").style.color = data.rain_active ? "#58a6ff" : "#8b949e";

    if (data.action !== undefined && data.action >= 0) {
        document.getElementById("action").textContent = ACTION_NAMES[data.action];
    }
    if (data.reward !== undefined) {
        totalReward += data.reward;
        const rewEl = document.getElementById("reward");
        rewEl.textContent = totalReward.toFixed(1);
        rewEl.style.color = totalReward >= 0 ? "#3fb950" : "#f85149";
    }
}

function log(msg, type) {
    const el = document.getElementById("log");
    const div = document.createElement("div");
    div.textContent = msg;
    if (type) div.className = type;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    if (el.children.length > 100) el.removeChild(el.firstChild);
}

function showStatus(msg) {
    const bar = document.getElementById("status-bar");
    bar.textContent = msg;
    bar.style.display = "block";
    setTimeout(() => bar.style.display = "none", 3000);
}

async function resetEnv() {
    try {
        const res = await fetch(API + "/reset", { method: "POST" });
        const data = await res.json();
        totalReward = 0;
        document.getElementById("reward").textContent = "0.0";
        updateScene(data);
        log("Environment reset", "info");
        showStatus("Environment Reset");
    } catch(e) {
        log("Connection error: is server running?", "negative");
    }
}

async function stepEnv() {
    try {
        const res = await fetch(API + "/step", { method: "POST" });
        const data = await res.json();
        if (data.error) {
            await resetEnv();
            return;
        }
        updateScene(data);
        const rew = data.reward >= 0 ? "positive" : "negative";
        log(`S${data.step} ${ACTION_NAMES[data.action]} R=${data.reward.toFixed(1)} H=${(data.forest_health*100).toFixed(1)}%`, rew);
        if (data.episode_done) {
            const result = data.forest_health >= 0.7 ? "WIN" : "LOSS";
            log(`Episode ended: ${result} | Health: ${(data.forest_health*100).toFixed(1)}%`, result === "WIN" ? "positive" : "negative");
            showStatus(result === "WIN" ? "Mission Success!" : "Mission Failed");
            stopAuto();
        }
    } catch(e) {
        log("Connection error", "negative");
    }
}

function toggleAuto() {
    if (autoInterval) {
        stopAuto();
    } else {
        autoInterval = setInterval(stepEnv, 400);
        document.getElementById("btn-auto").textContent = "Stop";
        document.getElementById("btn-auto").style.borderColor = "#f85149";
        document.getElementById("btn-auto").style.color = "#f85149";
        log("Auto-play started", "info");
    }
}

function stopAuto() {
    clearInterval(autoInterval);
    autoInterval = null;
    document.getElementById("btn-auto").textContent = "Auto Play";
    document.getElementById("btn-auto").style.borderColor = "#d29922";
    document.getElementById("btn-auto").style.color = "#d29922";
}

async function runEpisode() {
    log("Running full episode...", "info");
    showStatus("Running episode...");
    try {
        const res = await fetch(API + "/run_episode", { method: "POST" });
        const data = await res.json();
        const result = data.final_health >= 0.7 ? "WIN" : "LOSS";
        log(`Complete: ${data.n_steps} steps | R=${data.total_reward.toFixed(1)} | H=${(data.final_health*100).toFixed(1)}% | ${result}`,
            result === "WIN" ? "positive" : "negative");

        // Replay at 20fps
        totalReward = 0;
        let i = 0;
        const replay = setInterval(() => {
            if (i >= data.states.length) {
                clearInterval(replay);
                showStatus(result === "WIN" ? "Mission Success!" : "Mission Failed");
                return;
            }
            if (data.states[i].reward) totalReward += data.states[i].reward;
            document.getElementById("reward").textContent = totalReward.toFixed(1);
            updateScene(data.states[i]);
            i++;
        }, 50);
    } catch(e) {
        log("Connection error", "negative");
    }
}

init3D();

// Auto-start with retry
async function autoStart() {
    for (let i = 0; i < 10; i++) {
        try {
            await resetEnv();
            return;
        } catch(e) {
            await new Promise(r => setTimeout(r, 1000));
        }
    }
}
setTimeout(autoStart, 1500);
</script>
